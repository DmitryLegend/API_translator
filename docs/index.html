.switch input:focus-visible + .track{outline:3px solid var(--accent);outline-offset:3px}
.swatch-row{display:flex;align-items:center;gap:.75rem}
.swatch{width:52px;height:52px;border-radius:15px;border:1px solid var(--outline);flex:none}

.pipe{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin:.9rem 0}
.node{border:1px solid var(--outline-var);border-radius:var(--r-m);padding:.8rem .9rem;background:rgba(var(--sc-rgb),var(--panel-a));transition:border-color .2s,transform .2s var(--spring)}
.node .k{font-family:var(--mono);font-size:.67rem;color:var(--on-var);letter-spacing:.11em}
.node h3{font-size:1rem;margin:.3rem 0}
.node p{font-size:.84rem;color:var(--on-var);margin:0}
.node .meta{font-family:var(--mono);font-size:.67rem;color:var(--accent2);margin-top:.45rem}
.node.hot{border-color:var(--accent);transform:translateY(-2px)}
.console{background:var(--sc-low);border:1px sol
