# Упаковка .deb. Раньше для этого тянули setuptools со всеми его подводными
# камнями, а nfpm — одна статическая программа, которая просто пакует папку.
name: podstrochnik
arch: amd64
platform: linux
version: 1.0.1
section: utils
priority: optional
maintainer: DmitryLegend
description: Перевод того, что сейчас на экране компьютера
# opencv требует libGL, а Qt — набор xkb. Всё это есть в любой системе с
# графическим окружением, но пакетный менеджер об этом не знает.
depends:
  - libgl1
  - libglib2.0-0
  - libxkbcommon0
  - libxcb-cursor0
  - libxcb-icccm4
  - libxcb-keysyms1
  - libxcb-shape0
  - libdbus-1-3
contents:
  - src: dist/podstrochnik
    dst: /usr/bin/podstrochnik
  - src: podstrochnik.desktop
    dst: /usr/share/applications/podstrochnik.desktop
