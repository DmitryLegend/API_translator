name: Полный релиз (Все платформы)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты
        run: python3 android-port/test_core.py
      - name: Вшить ключ DeepL
        run: printf 'DEEPL_KEY = "%s"\n' "$DEEPL_API_KEY" > android-port/src/main/python/keys.py
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      - name: Сборка APK
        run: ./gradlew -p android-port --no-daemon assembleDebug
      - name: Подготовить артефакт
        run: |
          mkdir -p out
          cp $(find android-port/build/outputs/apk/debug -name "*.apk" | head -n 1) out/app-release-python.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/app-release-python.apk

  linux:
    name: Linux (.deb и .AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Системные библиотеки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 squashfs-tools
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Проверка и сборка
        run: |
          python desktop/test_lines.py
          pyinstaller --onefile --noconfirm --clean --name podstrochnik --distpath dist --workpath build desktop/podstrochnik.py
      - name: Собрать .deb
        run: |
          set -e
          rm -rf pkg && mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications
          cp dist/podstrochnik pkg/usr/bin/podstrochnik
          cp desktop/podstrochnik.desktop pkg/usr/share/applications/
          size=$(du -sk pkg | cut -f1)
          printf "Package: podstrochnik\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: DmitryLegend\nInstalled-Size: %s\nDepends: libgl1, libglib2.0-0, libxkbcommon0, libxcb-cursor0, libxcb-icccm4, libxcb-keysyms1, libxcb-shape0, libdbus-1-3\nDescription: Перевод текста на экране\n" "${{ github.ref_name }}" "$size" > pkg/DEBIAN/control
          printf '2.0\n' > debian-binary
          tar czf control.tar.gz -C pkg/DEBIAN control
          tar czf data.tar.gz -C pkg usr
          ar rc dist/podstrochnik_amd64.deb debian-binary control.tar.gz data.tar.gz
          rm -f control.tar.gz data.tar.gz debian-binary
      - name: Собрать .AppImage
        run: |
          curl -fsSL -o /tmp/runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          rm -rf AppDir && mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp dist/podstrochnik AppDir/usr/bin/
          cp desktop/podstrochnik.desktop AppDir/usr/share/applications/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/podstrochnik" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          mksquashfs AppDir /tmp/podstrochnik.squashfs -root-owned -noappend -quiet
          cp /tmp/runtime dist/podstrochnik-x86_64.AppImage
          cat /tmp/podstrochnik.squashfs >> dist/podstrochnik-x86_64.AppImage
          chmod +x dist/podstrochnik-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-files
          path: |
            dist/podstrochnik_amd64.deb
            dist/podstrochnik-x86_64.AppImage

  windows:
    name: Windows (.exe и .zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Зависимости и сборка
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
          pyinstaller --onefile --noconfirm --clean --name podstrochnik --distpath dist --workpath build desktop/podstrochnik.py
      - name: Упаковать в zip
        run: 7z a -bso0 -bsp0 dist\podstrochnik-win-x64.zip dist\podstrochnik.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: |
            dist/podstrochnik-win-x64.zip
            dist/podstrochnik.exe

  finalize:
    name: Создание релиза
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Скачать все артефакты
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release_files
          gh run download ${{ github.run_id }} -n android-apk -D release_files
          gh run download ${{ github.run_id }} -n linux-files -D release_files
          gh run download ${{ github.run_id }} -n windows-files -D release_files
          ls -lh release_files
      - name: Опубликовать релиз со всеми файлами
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes="Автоматическая сборка всех платформ. Android (APK), Windows (.exe, .zip), Linux (.deb, .AppImage)."
          
          # Пытаемся создать релиз, если он уже есть (например, создан вручную) - просто добавляем файлы
          gh release create "$tag" release_files/* --title "Подстрочник $tag" --notes "$notes" || \
          gh release upload "$tag" release_files/* --clobber
