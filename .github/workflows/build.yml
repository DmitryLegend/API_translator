name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write, а не read: комментарий к коммиту через API GitHub относится к
  # содержимому репозитория, и без права на запись шаг отчёта не сможет
  # ничего повесить. Это ключ, который воркфлоу сам создал, он действует
  # только внутри этого запуска.
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        id: build
        # continue-on-error нужен, чтобы дойти до шага с отчётом: без него шаг
        # с комментарием просто пропустится.
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Повесить лог ошибки к коммиту
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : '(нет build.log)'
            // Сначала пытаемся вытащить сами строки с ошибками, и только если
            // не вышло — последние 4000 символов лога целиком.
            const picked = log.split('\n').filter(l =>
              /^\s*[ew]: /.test(l) ||
              /error:|FAILURE|Execution failed|Caused by:|> Task .* FAILED|^\* What went wrong/.test(l)
            )
            const body = (picked.length ? picked.join('\n') : log.slice(-4000)).slice(0, 60000)
            // Комментарий именно к коммиту, а не к задаче: событие у нас
            // push, и context.issue там не существует.
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Сборка упала\n\n```\n' + body + '\n```'
            })

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
