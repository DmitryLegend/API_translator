name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write, а не read: комментарий к коммиту через API GitHub относится к
  # содержимому репозитория, и без права на запись шаг отчёта не сможет
  # ничего повесить. Это ключ, который воркфлоу сам создал, он действует
  # только внутри этого запуска.
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Разовый шаг: печатаем точные сигнатуры из android.jar, который сам
      # раннер и подтянул. Нужен, чтобы не угадывать параметры методов
      # Android по памяти. После того как всё собралось, шаг можно убрать.
      - name: Сигнатуры Android SDK
        run: |
          {
            echo "=== MediaProjection ==="
            javap -classpath "$ANDROID_HOME/platforms/android-36/android.jar" android.media.projection.MediaProjection
            echo "=== DisplayManager ==="
            javap -classpath "$ANDROID_HOME/platforms/android-36/android.jar" android.hardware.display.DisplayManager
          } > sdk.txt 2>&1 || true
          grep -i -A2 virtualdisplay sdk.txt

      - name: Unit tests and debug build
        id: build
        # continue-on-error нужен, чтобы дойти до шага с отчётом: без него шаг
        # с комментарием просто пропустится.
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
        # Ключ DeepL уходит в сборку через переменную окружения и попадает в
        # BuildConfig. Сам ключ в логах не печатается.
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Повесить лог ошибки к коммиту
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : '(нет build.log)'
            // Забираем хвост лога целиком, без выборочных строк: неизвестно
            // заранее, как именно отформатирует ошибку та или другая версия
            // Gradle, а 6000 символов заведомо влезают в комментарий.
            const body = log.slice(-12000).slice(0, 60000)
            const sdk = fs.existsSync('sdk.txt') ? fs.readFileSync('sdk.txt', 'utf8').slice(0, 4000) : ''
            // Комментарий именно к коммиту, а не к задаче: событие у нас
            // push, и context.issue там не существует.
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Сборка упала\n\n```\n' + body + '\n```\n\n### Сигнатуры SDK\n\n```\n' + sdk + '\n```'
            })

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
