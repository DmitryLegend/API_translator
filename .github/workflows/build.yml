name: Build APK

on:
  push:
    branches: [main]
    # Тег вида v1.0.0 собирает подписанный APK и выкладывает его в Releases.
    tags: ['v*']
  workflow_dispatch:

permissions:
  # write, а не read: комментарий к коммиту через API GitHub относится к
  # содержимому репозитория, и без права на запись шаг отчёта не сможет
  # ничего повесить. Это ключ, который воркфлоу сам создал, он действует
  # только внутри этого запуска.
  contents: write

jobs:
  apk:
    # На теге работает задача release, debug ей не нужен.
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        id: build
        # continue-on-error нужен, чтобы дойти до шага с отчётом: без него шаг
        # с комментарием просто пропустится.
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
        # Ключ DeepL уходит в сборку через переменную окружения и попадает в
        # BuildConfig. Сам ключ в логах не печатается.
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Повесить лог ошибки к коммиту
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : '(нет build.log)'
            // Забираем хвост лога целиком, без выборочных строк: неизвестно
            // заранее, как именно отформатирует ошибку та или другая версия
            // Gradle, а 6000 символов заведомо влезают в комментарий.
            const body = log.slice(-12000).slice(0, 60000)
            // Подробности упавших тестов лежат не в консоли Gradle, а в
            // XML-отчёте JUnit. Достаём оттуда тексты падений.
            const dir = 'app/build/test-results/testDebugUnitTest'
            let tests = '(отчёта нет)'
            if (fs.existsSync(dir)) {
              const parts = []
              for (const f of fs.readdirSync(dir).filter(f => f.endsWith('.xml'))) {
                const xml = fs.readFileSync(dir + '/' + f, 'utf8')
                for (const m of xml.matchAll(/<failure[\s\S]*?<\/failure>/g)) {
                  parts.push(f + ':\n' + m[0].replace(/<[^>]+>/g, ' ').replace(/&#10;/g, '\n').trim().slice(0, 900))
                }
              }
              tests = parts.length ? parts.join('\n\n') : '(падений в отчёте нет)'
            }
            // Комментарий именно к коммиту, а не к задаче: событие у нас
            // push, и context.issue там не существует.
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Сборка упала\n\n```\n' + body + '\n```\n\n### Тесты\n\n```\n' + tests.slice(0, 20000) + '\n```'
            })

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Релиз собирается только по тегу. Обычный пуш в main даёт debug-сборку для
  # быстрой проверки, а «официальный» файл появляется на странице Releases
  # репозитория — оттуда его и качают.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Проверить, что секреты подписи на месте
        # Подпись нельзя пропускать: без неё Android просто не поставит файл,
        # а узнать об этом можно только на телефоне. Ловим здесь.
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Нет секретов подписи релиза (RELEASE_KEYSTORE_BASE64, RELEASE_KEY_PASSWORD)"
            exit 1
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Тесты и подписанная сборка
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Выложить на страницу Releases
        env:
          # Токен самого workflow, он умеет ровно то, что разрешено в
          # permissions выше: записать содержимое репозитория.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          apk=app/build/outputs/apk/release/app-release.apk
          # Исходники GitHub прикладывает к релизу сам, отдельным пунктом
          # «Source code» — дублировать их архивом здесь незачем.
          #
          # При повторном запуске по тому же тегу релиза уже существует, и
          # create упал бы. Поэтому сперва пробуем обновить, и только если
          # релиза ещё нет — создаём.
          # Подпись v1 оставляет в APK файлы META-INF/*.SF. Их нет — значит
          # сборка вышла неподписанной и телефон её не примет.
          if ! unzip -l "$apk" | grep -q 'META-INF/.*\.\(SF\|RSA\)'; then
            echo "::error::APK не подписан, публиковать нечего"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --title "Подстрочник $tag" \
              --notes "Подписанная сборка для установки на телефон." \
              --generate-notes
          fi
          echo "APK: $(du -h "$apk" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
