name: Build Auto Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты чистой логики
        run: python3 android-port/test_core.py

      - name: Вшить ключ DeepL
        run: |
          printf 'DEEPL_KEY = "%s"\n' "$DEEPL_API_KEY" > android-port/src/main/python/keys.py
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Сборка Debug APK
        run: ./gradlew -p android-port --no-daemon assembleDebug

      - name: Создать релиз и прикрепить APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Находим собранный debug apk
          apk_path=$(find android-port/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          # Создаем релиз и сразу прикрепляем файл
          gh release create "$tag" "$apk_path" \
            --title "Подстрочник $tag" \
            --notes "Автоматическая сборка. Если приложение не обновляется поверх старого, удали предыдущую версию с телефона."
