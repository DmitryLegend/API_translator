name: Build APK

on:
  push:
    branches: [main]
    # Тег вида v1.0.0 собирает подписанный APK и выкладывает его в Releases.
    tags: ['v*']
  workflow_dispatch:

permissions:
  # write, а не read: комментарий к коммиту через API GitHub относится к
  # содержимому репозитория, и без права на запись шаг отчёта не сможет
  # ничего повесить. Это ключ, который воркфлоу сам создал, он действует
  # только внутри этого запуска.
  contents: write

jobs:
  apk:
    # На теге работает задача release, debug ей не нужен.
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        id: build
        # continue-on-error нужен, чтобы дойти до шага с отчётом: без него шаг
        # с комментарием просто пропустится.
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
        # Ключ DeepL уходит в сборку через переменную окружения и попадает в
        # BuildConfig. Сам ключ в логах не печатается.
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Повесить лог ошибки к коммиту
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : '(нет build.log)'
            // Забираем хвост лога целиком, без выборочных строк: неизвестно
            // заранее, как именно отформатирует ошибку та или другая версия
            // Gradle, а 6000 символов заведомо влезают в комментарий.
            const body = log.slice(-12000).slice(0, 60000)
            // Подробности упавших тестов лежат не в консоли Gradle, а в
            // XML-отчёте JUnit. Достаём оттуда тексты падений.
            const dir = 'app/build/test-results/testDebugUnitTest'
            let tests = '(отчёта нет)'
            if (fs.existsSync(dir)) {
              const parts = []
              for (const f of fs.readdirSync(dir).filter(f => f.endsWith('.xml'))) {
                const xml = fs.readFileSync(dir + '/' + f, 'utf8')
                for (const m of xml.matchAll(/<failure[\s\S]*?<\/failure>/g)) {
                  parts.push(f + ':\n' + m[0].replace(/<[^>]+>/g, ' ').replace(/&#10;/g, '\n').trim().slice(0, 900))
                }
              }
              tests = parts.length ? parts.join('\n\n') : '(падений в отчёте нет)'
            }
            // Комментарий именно к коммиту, а не к задаче: событие у нас
            // push, и context.issue там не существует.
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Сборка упала\n\n```\n' + body + '\n```\n\n### Тесты\n\n```\n' + tests.slice(0, 20000) + '\n```'
            })

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Релиз собирается только по тегу. Обычный пуш в main даёт debug-сборку для
  # быстрой проверки, а «официальный» файл появляется на странице Releases
  # репозитория — оттуда его и качают.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Проверить, что секреты подписи на месте
        # Подпись нельзя пропускать: без неё Android просто не поставит файл,
        # а узнать об этом можно только на телефоне. Ловим здесь.
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Нет секретов подписи релиза (RELEASE_KEYSTORE_BASE64, RELEASE_KEY_PASSWORD)"
            exit 1
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Тесты и подписанная сборка
        # bundleRelease обязателен для Play: новое приложение туда нельзя
        # загрузить apk, принимают только .aab. Собираем оба — apk для
        # обычной установки руками, aab для магазина.
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease bundleRelease
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Проверить то, на что смотрит Google Play
        # С 31 августа 2026 года Play не принимает сборку с targetSdk ниже 36,
        # а для новых приложений принимает только .aab. Обе проверки дешевле
        # одного ручного взгляда в манифест, поэтому пусть о них говорит
        # сама сборка.
        run: |
          set -e
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$aapt2" dump badging app/build/outputs/apk/release/app-release.apk \
            | grep -E '^package:|^sdkVersion:|^targetSdkVersion:'
          test -f app/build/outputs/bundle/release/app-release.aab
          echo "aab на месте"

      - name: Выложить на страницу Releases
        env:
          # Токен самого workflow, он умеет ровно то, что разрешено в
          # permissions выше: записать содержимое репозитория.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          apk=app/build/outputs/apk/release/app-release.apk
          # Google Play принимает для новых приложений только .aab, apk туда
          # не загрузить. Лежит рядом, чтобы было что взять при публикации.
          aab=app/build/outputs/bundle/release/app-release.aab

          # Ищем блок подписи прямо в файле. Подпись v1 клала бы рядом
          # META-INF/*.SF, но при minSdk 26 она по умолчанию выключена, и там
          # пусто даже у вполне подписанного APK — на этом уже обжигались.
          # Подпись v2/v3 кладёт в файл блок с такой вот подписью внутри.
          if ! grep -aq 'APK Sig Block 42' "$apk"; then
            echo "::error::В APK нет блока подписи, публиковать нечего"
            exit 1
          fi

          # Текст собираем через printf с \n: gh не берёт одновременно
          # --notes и --generate-notes, а многострочную строку в YAML с
          # отступом иначе не записать — heredoc с нулевым отступом рвёт файл.
          notes=$(printf '%b' \
            'Скачайте `app-release.apk` и откройте на телефоне — Android спросит разрешение на установку.\n\n' \
            'При **первой** установке удалите прежнюю сборку из черновиков: подпись у них разная, и Android не поставит релиз поверх. Дальше версии обновляются штатно.\n\n' \
            'Исходники — пункт **Source code** рядом с этим списком, GitHub прикладывает их к каждому релизу сам.\n')

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$aab" --clobber
          else
            gh release create "$tag" "$apk" "$aab" \
              --title "Подстрочник $tag" \
              --notes "$notes"
          fi
          echo "APK: $(du -h "$apk" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
