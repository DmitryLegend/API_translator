name: Сборка для компьютера

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Один образ Linux на оба формата. AppImage собирается вручную из AppDir:
  # appimagetool требует FUSE, которого в контейнере нет, а squashfs не
  # требует ничего.
  linux:
    name: Linux (.deb и .AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Поставить системные библиотеки и зависимости
        # PySide6 при импорте требует системных библиотек, и на свежем
        # контейнере их нет: без libEGL даже `import PySide6` падает. Тот же
        # список нужен и в depends пакета, что собирается ниже.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller

      - name: Проверить логику строк
        run: python desktop/test_lines.py

      - name: Собрать
        run: |
          pyinstaller --onefile --noconfirm --clean \
            --name podstrochnik \
            --distpath dist --workpath build desktop/podstrochnik.py
          ls -lh dist/podstrochnik

      - name: Собрать .deb
        # Пакет .deb — это просто архив ar с тремя файлами внутри: метка
        # формата, список файлов пакета и сами файлы. Раньше для этого тянули
        # nfpm, но все его ссылки разом отдали 404, а своя сборка — это
        # ar и tar, которые на раннере уже есть.
        run: |
          set -e
          rm -rf pkg
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications
          cp dist/podstrochnik pkg/usr/bin/podstrochnik
          cp desktop/podstrochnik.desktop pkg/usr/share/applications/

          size=$(du -sk pkg | cut -f1)
          cat > pkg/DEBIAN/control <<EOF
          Package: podstrochnik
          Version: 1.0.1
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: DmitryLegend <dmitrylegend@users.noreply.github.com>
          Installed-Size: $size
          Depends: libgl1, libglib2.0-0, libxkbcommon0, libxcb-cursor0, libxcb-icccm4, libxcb-keysyms1, libxcb-shape0, libdbus-1-3
          Description: Перевод того, что сейчас на экране компьютера
           Захватывает экран, распознаёт текст и рисует перевод поверх.
          EOF

          # Метка формата обязана быть ровно такой, иначе dpkg откажется
          # ставить пакет. И лежит она не в pkg, а рядом с архивом: внутри
          # ar имя файла пишется как есть, и «pkg/debian-binary» dpkg
          # не признает.
          printf '2.0\n' > debian-binary
          # В control.tar.gz файл должен лежать прямо в корне, а не в
          # DEBIAN/: этот каталог нужен только как исходная раскладка,
          # и dpkg ругается на пакет, если его там не найдёт.
          tar czf control.tar.gz -C pkg/DEBIAN control
          tar czf data.tar.gz -C pkg usr
          ar rc dist/podstrochnik_amd64.deb debian-binary control.tar.gz data.tar.gz
          rm -f control.tar.gz data.tar.gz debian-binary
          dpkg-deb --info dist/podstrochnik_amd64.deb | head -5 || true

      - name: Собрать .AppImage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          # Готовый runtime AppImage: маленькая программа, которая умеет
          # примонтировать squashfs-образ и запустить из него AppRun.
          curl -fsSL -o /tmp/runtime \
            https://github.com/continuousintegration/appimagetool/releases/download/continuous/runtime-x86_64
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp dist/podstrochnik AppDir/usr/bin/
          cp desktop/podstrochnik.desktop AppDir/usr/share/applications/
          # AppRun — это просто AppDir/AppRun, а не он сам, так как стандарт
          # требует, чтобы он был первым и чтобы находился в корне.
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/podstrochnik" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          mksquashfs AppDir /tmp/podstrochnik.squashfs -root-owned -noappend -quiet
          cp /tmp/runtime dist/podstrochnik-x86_64.AppImage
          cat /tmp/podstrochnik.squashfs >> dist/podstrochnik-x86_64.AppImage
          chmod +x dist/podstrochnik-x86_64.AppImage

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for f in dist/podstrochnik_amd64.deb dist/podstrochnik-x86_64.AppImage; do
            gh release upload "$tag" "$f" --clobber || gh release create "$tag" "$f" \
              --title "Подстрочник $tag" --notes "Сборка для компьютера."
          done

      - uses: actions/upload-artifact@v4
        with:
          name: podstrochnik-linux
          path: |
            dist/podstrochnik_amd64.deb
            dist/podstrochnik-x86_64.AppImage
          if-no-files-found: error

  # Windows 10 и 11. Один и тот же exe, разницы между ними для нашей задачи
  # нет: PyInstaller сам собирает под минимальную версию, какую умеет.
  windows:
    name: Windows 10 и 11 (.exe)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller

      - name: Собрать
        run: pyinstaller --onefile --noconfirm --clean --name podstrochnik --distpath dist --workpath build desktop/podstrochnik.py

      # Подписи нет: сертификат нужно покупать, и без него Windows всё равно
      # спросит подтверждение, но SmartScreen не придерётся. Пока сборка
      # честно помечена как неподписанная, чтобы это не было сюрпризом.
      - name: Упаковать в zip
        run: |
          7z a -bso0 -bsp0 dist\podstrochnik-win-x64.zip dist\podstrochnik.exe

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${env:GITHUB_REF_NAME}"
          for f in dist\podstrochnik-win-x64.zip dist\podstrochnik.exe; do
            gh release upload $tag $f --clobber || gh release create $tag $f `
              --title "Подстрочник $tag" --notes "Сборка для компьютера."
          done

      - uses: actions/upload-artifact@v4
        with:
          name: podstrochnik-windows
          path: |
            dist/podstrochnik-win-x64.zip
            dist/podstrochnik.exe
          if-no-files-found: error
