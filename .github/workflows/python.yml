name: Build Python APK

on:
  push:
    branches: [main]
    paths: ['android-port/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  # write, а не read: как в build.yml — отчёт о падении вешается
  # комментарием к коммиту.
  contents: write

jobs:
  python-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты чистой логики
        run: python3 android-port/test_core.py

      - name: Вшить ключ DeepL в keys.py
        run: |
          if [ -z "$DEEPL_API_KEY" ]; then
            echo "::error::Нет секрета DEEPL_API_KEY — добавьте его в Settings → Secrets репозитория"
            exit 1
          fi
          printf '"""Ключ DeepL, вшиваемый при сборке. CI перезаписывает этот файл из секрета."""\nDEEPL_KEY = "%s"\n' "$DEEPL_API_KEY" > android-port/src/main/python/keys.py
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Сборка
        id: build
        # continue-on-error нужен, чтобы дойти до шага с отчётом.
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew -p android-port --no-daemon assembleDebug 2>&1 | tee python-build.log

      - name: Повесить лог ошибки к коммиту
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const log = fs.existsSync('python-build.log') ? fs.readFileSync('python-build.log', 'utf8') : '(нет python-build.log)'
            const body = log.slice(-12000).slice(0, 60000)
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Сборка Python-версии упала\n\n```\n' + body + '\n```'
            })

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-python
          # Имя файла зависит от имени корневого Gradle-проекта, поэтому
          # берём любым wildcard.
          path: android-port/build/outputs/apk/debug/*.apk
          if-no-files-found: error
